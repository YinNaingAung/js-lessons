<html>
    <script>

        // when we got error it does not show anything so 
        // i want to make to do each task
        //  right function does its own task and 
        // left function does its own task
        function div2(a,b){
            if(b==0){
                return left.of('cannot divide by zero')
            }else{
                return right.of(a/b)
            }
        }
         let left = (value) => ({
            valueOf :()=> value,
            isLeft(){
                return true; // cneck error? 
            },
            map(fn){
                return this
            },
            matchWith({left,right}){
                return left(value)
            }
        })
        left.of = left;

        let right = (value) => ({
            valueOf : ()=> value,
            isLeft()
            {
                return false;
            },
            map(fn)
            {
                return right.of(fn(value))
            },
            matchWith({left,right}){
                return right(value)
            }
        })
        right.of = right;
       
        div2(12,2)
            .map(x=> x+1)
            .matchWith({
                left : (err) => console.log("err",err),
                right : (result) => console.log("success", result)
            })
