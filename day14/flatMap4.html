<html>
    <script>
        let arr = [1,2,3]
        let result = arr.map(x => x+1)
        let result1 = arr.map(x => [x, x*3])
        let result2 = arr.map(x => [x, x*3]).flat() // nested array to one array
        // instaed of using like that use flatMap
        let result3 = arr.flatMap(x=>[x,x*2])

        console.log('result', result)
        console.log('result1', result1)
        console.log("result2", result2)
        console.log('result3', result3)

    </script>
</html>
