       // Return Either to solve

  
 let left = (value) => ({
            valueOf :()=> value,
            isLeft(){
                return true; // cneck error? 
            },
            map(fn){
                return this
            },
            matchWith({left,right}){
                return left(value)
            }
        })
        left.of = left;

        let right = (value) => ({
            valueOf : ()=> value,
            isLeft()
            {
                return false;
            },
            map(fn)
            {
                return right.of(fn(value))
            },
            matchWith({left,right}){
                return right(value)
            }
        })
        right.of = right;
       
        let Monad = (value)=> ({
            valueOf : ()=> value,
            map : (fn)=> Monad(fn(value)),
            ap : (another)=> Monad(value(another.valueOf()))
        })
        Monad.of = Monad

        function validateName(obj){
            console.log('validateName',obj)
            if(obj.name === ""){
                return left.of('Name cannot be empty')
            }else{
                return right.of(obj)
            }
        }
        function validateEmail(obj){
            console.log('validateEmail',obj)
            if(obj.email.includes('@')=== false){
                return left.of('Invalid email')
            }else{
                return right.of(obj)
            }
        }

        let user = {
            name : 'John',
            email : 'y@y.com'
        }
        right.of(user)
            .map(validateName) // either (right.of(user)) => map(validateName => this is not normal fucntion)
                                // so it will return function
            .map(validateEmail) 
            .matchWith({
                left:(err) => (console.log('error', err)),
                right:  (result) => console.log('success', result)
            })

    </script>
