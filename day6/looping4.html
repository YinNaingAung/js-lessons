<html>
    <script>
        // while loop 
        let x =0
        while (x<3) {
            console.log('hello world',x);
            x++;
        }
        console.log('end',x)
        //()=> condition , {}=> body 
        
        let y = 5 //initialization
        while (y>0){ //condition
            console.log(y) 
            y-- //step
        }

        // Do while loop  
        let z = 0
        do {
            console.log("first work")
            z++
        } while (z>3); // z is not greater than 3 so this condition is wrong but it runs at least one time

        // do while => even condition is wrong at least one work
    </script>
</html>
