<html>
    <script>
        let num = + prompt("enter the number")
        switch(num){
            case 1:
            console.log("one");
            // break;  // if don't have break if will run case 1 and case2

            case 2:
            console.log("two")
            break;

            case 3:
            console.log("three")
            break;

            default:
                console.log("other")
            break;

        }

        // strict equal 
        switch("sunny"){
            case 'windy':
                console.log("windy")
                break;
            
            case 'sunny':
                console.log("sunny")
                break;
            
            default :
                console.log("cloudy ")
        }

        // strict equal 
        let str = "1";
        switch(str){
            case 1:
                console.log("one")
            break
            
            default:
                console.log('false') 
        }
        // answer false  
    </script>
</html>
