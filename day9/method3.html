<html>
    <script>
        // every and some method 
        let num = [1,2,3,4]

        // this every method returns true when every checked value is fit the condition

        let every = num.every(i => i > 0 )
        console.log('every', every) // true

        let every1 = num.every (i => i<4)
        console.log('every1', every1) //false

        // in here some method returns when some of the checked value is fix the condition
        // it will return true
        let some = num.some(i => i <0) // false
        console.log('some',some)

        let some1 = num.some(i => i < 2) // true
        console.log('some1', some1)
