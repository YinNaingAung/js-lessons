<html>
    <script>
        // flat  two dimensional arrays to one dimensional array
        // [[]] => [] or [[[]]] => [[]]
        let arr = [1,2,3,4];
       let newarr = arr.map(x => [x, x*2]) // [1,2] => [4,8]
        console.log('newarr', newarr)

       let new1 = arr.map(x => [x, x*2]).flat()
       console.log('new1', new1 )
        // or  use flatmap
       let new2 = arr.flatMap(x => [x, x*2]);
       console.log('new2', new2)

       console.log('[1,2,[3],[4]]',[1,2,[[3],[4]]].flat(2))

        let num = [1,2,3]
        console.log('num', num)

      console.log( num.concat([5,6])) 



    //   push 
      let number = [1,2,3,4]
      number.push(5);
      console.log('number', number)
    console.log('number.push(3)', number.push(5))
    
    // pop 
    number.pop()
    console.log('number.pop()', number.pop())

    // unshift => add the value as the first place the array
    number.unshift(12,2)
    console.log('number.unshift()',number)

    //shift
    number.shift()
    console.log('number.shift()', number)
    console.log(number)
    //slice 
    number.slice(1,3) // get the value from 1 to before 3
    console.log('number.slice(1,3)', number.slice(1,3))
    console.log('number.slic(1,-1)', number.slice(1,-1)) // start the number from the last number right to left

    //splice => remove the value
    console.log(number)
    number.splice(1,1, 100,300) // we can replace the value in the place of the removed vluae
    console.log('number.splice(1,1)', number)
