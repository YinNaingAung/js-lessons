<html>
    <script>
        // comma works left to right but it give out the right operand
        //evaluates left to right and returns the value of right operand (rightmost)
        let a = 1, b = 2
        console.log('a',a)
        console.log('b',b)
        // a = (console.log("first"), console.log("second"),100);
        a = (b++, 10)
        console.log('a',a)
        console.log('b',b)
        a = (b++, b+10, 9)
        console.log('a',a)
        console.log('b',b)
    </script>
</html>
