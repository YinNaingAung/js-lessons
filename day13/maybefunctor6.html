        // when we want to handle invaild input 
        let Maybe = (value) => ({
            valueOf :()=> value,
            isEmpty(){
                return value === null || value === undefined
            },
            map(fn){
                return this.isEmpty()? Maybe.of(null): Maybe.of(fn(value))
            }
        })
        Maybe.of = Maybe;

        function appendHi(str){
            return str + 'world'
        }
        function toUpper(str){

        }
