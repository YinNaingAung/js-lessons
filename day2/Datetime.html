<html>
    <script>
        let now = new Date();
        console.log('Now', now);
        console.log('getFullyear', now.getFullYear());
        console.log('getDate', now.getDate());
        console.log('getMonth',now.getMonth());
        console.log('getDay',now.getDay());
        console.log('getHours',now.getHours());
        console.log('getMinutes',now.getMinutes());
        console.log('getSeconds',now.getSeconds());
        console.log('getMiliseconds',now.getMilliseconds());


        // string literal
        // single line string literal
        let info = "My name is 'Yin Naing Aung'. I live in \"Washinton DC\""
        console.log(info)   
        let name = 'yinnaingaung';
        let age = 24
        console.log("My name is " + name +" and " + "I am "+ age)
        console.log(`My name is ${name} and I am ${age}
        first 
        second
          `)//multi line (pragmatic)

        let add = 1 +3 ;
        let add1 = 'number' + 1 +3;// if wwnt 4 use (1+3) in here
        // answer number 13
        console.log(add1)
        console.log(add)

        // substing vs slice 
        console.log('substring',name.substring(0,3))
        console.log(name.substring(3))
        console.log(name.substring(-3))
         
        console.log('slice',name.slice(0,3));
        console.log(name.slice(3))
        console.log(name.slice(-7,name.length))
        // api => application programming interface 

        const studentName = "Arkar, Kaythwe, NuNu";
        // use split method string to array when we get each value arkar or kaythwe it separated by , so 
        const stdNameToArray = studentName.split(',');
        const letters = 'A B C D E';
        const array = letters.split(" ");
        console.log(array)
        console.log(stdNameToArray)

        //indexOF works for string not like array //noted case sensitive
        // IndexOf and Includes => be able to use in checking condition
        let index = name.indexOf('g')
        console.log('indexOf(g)',index)
        console.log('lastIndexOf(n)',name.lastIndexOf('n'))

        console.log('indexOf(yin)',name.indexOf('yin')); //yin is included in variable so it will only return 0
                                                         // because indexOf method checks only one letters and give its position (yin is not one letters it is group)
        console.log('indexOf(lwin)', name.indexOf("lwin")) //it will returns -1 (lwin is not in name)
        
        console.log('include(yin)', name.includes('yin')) //true
        console.log('include(yin)', name.includes('moe')) // false


        // start with and end with 
        console.log("startswith(yin)", name.startsWith('yin'))
        console.log("endsWith(aung)", name.endsWith('aung'))
        console.log('startsWith(moe)', name.startsWith('moe'))
        
        

    </script>
