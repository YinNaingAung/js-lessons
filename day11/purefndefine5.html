    <script>
        // Pure Function 
        // Pure function behaves in the same way as mathematical function and provide diverse benefits.and
        // two condition to be pure 

        // 1.Giving the same arguments and the function calculate and return the same result 
        // 2. no side effect 
        function pure(x,y){
            return x+y // do not modify and use the parameter only is pure
        }
        let result = pure(1,2)
        console.log('result', result)
        result = pure(1,2);
        console.log('result', result)

        let data = 10;
        function getData(){
            return data //impure because data can change when someone use and the result will change
        }
        console.log('getData', getData())

        function getDate(){
            return new Date()
        }
        console.log('getDate', getDate())
    </script>
